<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Proiectul CLAP - Cinema Local, Arhive și Proiecții</title>
<style>
:root{--bg:#f4f1ec;--sf:#fff;--tx:#1b2130;--mu:#667085;--ln:#d9d4ca;--ac:#b4541a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161f;--sf:#1a2230;--tx:#e8ecf2;--mu:#98a2b3;--ln:#2e3a4e;--ac:#f0b35c}}
:root[data-theme="dark"]{--bg:#10161f;--sf:#1a2230;--tx:#e8ecf2;--mu:#98a2b3;--ln:#2e3a4e;--ac:#f0b35c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px 14px 40px}
h1{font:700 32px/1.05 Georgia,"Times New Roman",serif;margin:8px 0 2px;letter-spacing:-.01em}
.tag{margin:0;font:italic 16px Georgia,serif;color:var(--mu)}
.sub{color:var(--mu);margin:6px 0 18px;font-size:13px}
.row{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
button.chip{flex:none;border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:999px;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer}
button.chip[aria-pressed="true"]{background:var(--tx);color:var(--bg);border-color:var(--tx)}
button.chip:disabled{opacity:.35;cursor:default}
button.chip:focus-visible,a:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.days button.chip{border-radius:10px;text-align:center;line-height:1.2;padding:6px 0;min-width:46px;flex:1 0 46px}
.days b{display:block;font-size:17px}
.days span{font-size:11px;text-transform:uppercase;letter-spacing:.03em}
.lbl{font-size:13px;color:var(--mu);margin:6px 0 2px}
.film{display:flex;gap:12px;background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:10px 12px;margin:10px 0}
.pos{flex:none;width:52px;height:78px;border-radius:3px;object-fit:cover;background:var(--ln);display:grid;place-items:center;font:700 20px Georgia,serif;color:var(--mu)}
.info{flex:1;min-width:0}
.film h2{font:700 18px/1.25 Georgia,"Times New Roman",serif;margin:0}
.orig{margin:0;font-size:13px;color:var(--mu);font-style:italic;line-height:1.3}
.meta{color:var(--mu);font-size:13px;margin:2px 0 0;line-height:1.35}
.meta a{color:inherit;text-decoration:underline;text-decoration-color:var(--ln)}
.bd{display:inline-block;border:1px solid var(--ln);border-radius:4px;font:600 11px/1 system-ui,sans-serif;padding:2px 4px;margin-left:6px;vertical-align:2px;color:var(--mu)}
.tm{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;align-items:flex-start}
.it{display:flex;flex-direction:column;gap:2px;width:80px}
.cn{font-size:11px;color:var(--mu);display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden}
.cn i{flex:none;width:7px;height:7px;border-radius:50%;background:var(--cc)}
.t{display:flex;flex-direction:column;align-items:center;padding:3px 4px;border:1.5px solid var(--cc);border-radius:6px;color:var(--tx);text-decoration:none;font-weight:700;font-size:15px;line-height:1.25;font-variant-numeric:tabular-nums}
.t small{font-weight:400;font-size:11px;color:var(--mu)}
a.t:hover{background:var(--cc);color:#fff}
a.t:hover small{color:inherit}
.t.so{border-color:var(--ln);color:var(--mu)}
.t.so b{text-decoration:line-through}
.t.past{opacity:.4}
.nt{font-size:11px;line-height:1.25;color:var(--mu);overflow-wrap:anywhere}
.empty{padding:28px 8px;color:var(--mu);text-align:center}
.note{font-size:13px;color:var(--mu);border-top:1px solid var(--ln);margin-top:28px;padding-top:14px}
.note p{margin:0 0 8px}
.warn{color:var(--ac)}
.tmdb{display:flex;align-items:center;gap:10px;margin-top:14px;opacity:.85}
.tmdb img{height:12px;width:auto;flex:none}
.tmdb p{margin:0;font-size:11px}
</style>
</head>
<body>
<main>
<h1>Proiectul CLAP</h1>
<p class="tag">Cinema Local, Arhive și Proiecții</p>
<p class="sub" id="upd">Se încarcă programul…</p>
<div class="lbl">Cinema</div>
<div class="row" id="cin"></div>
<div class="lbl">Săptămâna</div>
<div class="row" id="weeks"></div>
<div class="row days" id="days"></div>
<div class="lbl">Preț afișat</div>
<div class="row" id="pr"></div>
<div class="row"><button class="chip" id="sold" aria-pressed="false">Ascunde sold out</button></div>
<div id="list"></div>
<div class="note" id="note"></div>
</main>
<script>
var D=null,S={cin:{},week:"",day:"",tier:"adult",sold:false},TZ="Europe/Bucharest";
function today(){return new Intl.DateTimeFormat("en-CA",{timeZone:TZ}).format(new Date())}
function nowHM(){return new Intl.DateTimeFormat("en-GB",{timeZone:TZ,hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).format(new Date())}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function chip(txt,on,fn,dis){var b=el("button","chip",txt);b.setAttribute("aria-pressed",on?"true":"false");if(dis)b.disabled=true;else b.onclick=fn;return b}
function iso(x){return x.getFullYear()+"-"+("0"+(x.getMonth()+1)).slice(-2)+"-"+("0"+x.getDate()).slice(-2)}
function dt(d){return new Date(d+"T12:00:00")}
function addDays(d,n){var x=dt(d);x.setDate(x.getDate()+n);return iso(x)}
function weekStart(d){return addDays(d,-((dt(d).getDay()+6)%7))}
function fmt(iso8){return new Date(iso8).toLocaleString("ro-RO",{timeZone:TZ,day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}
function mon(d){return dt(d).toLocaleDateString("ro-RO",{month:"short"})}
function weekLabel(w){
  if(w===weekStart(today()))return "Săptămâna asta";
  var e=addDays(w,6),a=dt(w),b=dt(e);
  return a.getMonth()===b.getMonth()?a.getDate()+"–"+b.getDate()+" "+mon(e):a.getDate()+" "+mon(w)+" – "+b.getDate()+" "+mon(e);
}
function nz(s){return (s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim()}
function nice(s){
  if(s!==s.toLocaleUpperCase("ro"))return s;
  return s.toLocaleLowerCase("ro").replace(/(^|[\s\/:(\-])(\p{L})/gu,function(m,a,b){return a+b.toLocaleUpperCase("ro")});
}
function price(s){
  var p=s.prices,b=s.box||{},t=S.tier;
  if(p[t]!=null)return p[t]+" lei";
  if(b[t]!=null)return b[t]+" lei †";
  if(p.adult!=null)return p.adult+" lei*";
  return "";
}
function shortNote(n){
  if(!n)return "";
  var p=[];
  if(/avanpremier/i.test(n))p.push("Avanpremieră");else if(/premier/i.test(n))p.push("Premieră");else if(/preview/i.test(n))p.push("Preview");
  if(/q\s*&\s*a/i.test(n))p.push("Q&A");else if(/discu[tț]i/i.test(n))p.push("Discuție");
  return p.length?p.join(" + "):(n.length>30?n.slice(0,28)+"…":n);
}
function tags(s,F){
  var t=[],a=s.audio||[],sub=(s.subs||[]).filter(function(x){return x!=="RO"});
  if(a.length&&a.every(function(x){return x==="RO"})&&F.orig_lang&&F.orig_lang!=="ro")t.push("dublat");
  if(sub.length)t.push("sub "+sub.join("/"));
  return t.join(" · ");
}
function visible(s){return S.cin[s.cinema]&&!(S.sold&&s.status==="sold_out")}
function count(d){var n=0;D.screenings.forEach(function(s){if(s.date===d&&visible(s))n++});return n}
function pickDay(){
  var t=today(),i,d;
  if(S.week===weekStart(t)&&count(t))return t;
  for(i=0;i<7;i++){d=addDays(S.week,i);if(count(d))return d}
  return S.week;
}
function load(){
  fetch("data/screenings.json?"+Date.now()).then(function(r){
    if(!r.ok)throw new Error(r.status);return r.json();
  }).then(function(d){
    D=d;D.films=D.films||{};var t=today(),ws={};
    D.screenings=D.screenings.filter(function(s){return s.date>=t});
    D.screenings.forEach(function(s){S.cin[s.cinema]=1;ws[weekStart(s.date)]=1});
    D.weeks=Object.keys(ws).sort();
    S.week=ws[weekStart(t)]?weekStart(t):D.weeks[0];
    S.day=pickDay();
    ui();
  }).catch(function(e){
    document.getElementById("upd").textContent="Nu am putut încărca programul ("+e.message+"). Încearcă mai târziu.";
  });
}
function ui(){
  var c=document.getElementById("cin");c.innerHTML="";
  Object.keys(D.cinemas).forEach(function(k){
    if(!(k in S.cin))return;
    c.appendChild(chip(D.cinemas[k].name,S.cin[k],function(){S.cin[k]=S.cin[k]?0:1;S.day=pickDay();ui()}));
  });
  var w=document.getElementById("weeks");w.innerHTML="";
  D.weeks.forEach(function(v){w.appendChild(chip(weekLabel(v),S.week===v,function(){S.week=v;S.day=pickDay();ui()}))});
  var d=document.getElementById("days");d.innerHTML="";
  for(var i=0;i<7;i++){(function(v){
    var b=chip("",S.day===v,function(){S.day=v;ui()},!count(v));
    b.appendChild(el("span","",dt(v).toLocaleDateString("ro-RO",{weekday:"short"})));
    b.appendChild(el("b","",String(dt(v).getDate())));
    d.appendChild(b);
  })(addDays(S.week,i))}
  var p=document.getElementById("pr");p.innerHTML="";
  [["adult","Adult"],["student","Elev / student"],["pensioner","Pensionar"]].forEach(function(x){
    p.appendChild(chip(x[1],S.tier===x[0],function(){S.tier=x[0];ui()}));
  });
  document.getElementById("sold").setAttribute("aria-pressed",S.sold?"true":"false");
  document.getElementById("upd").textContent="Actualizat "+fmt(D.generated);
  list();notes();
}
function list(){
  var out=document.getElementById("list");out.innerHTML="";
  var g={},order=[],now=nowHM(),isToday=S.day===today();
  D.screenings.forEach(function(s){
    if(s.date!==S.day||!visible(s))return;
    var k=s.film||("t:"+s.title);if(!g[k]){g[k]=[];order.push(k)}g[k].push(s);
  });
  order.forEach(function(k){g[k].sort(function(a,b){return a.time<b.time?-1:a.time>b.time?1:0})});
  order.sort(function(a,b){return g[a][0].time<g[b][0].time?-1:1});
  if(!order.length){out.appendChild(el("div","empty","Nicio proiecție pentru filtrele alese."));return}
  order.forEach(function(k){
    var rs=g[k],r=rs[0],F=D.films[k]||{title:r.title};
    var f=el("section","film"),info=el("div","info");
    var title=nice(F.title||r.title);
    if(F.poster){var im=el("img","pos");im.src=F.poster;im.alt="";im.loading="lazy";
      im.onerror=function(){im.replaceWith(el("div","pos",title.charAt(0)))};f.appendChild(im)}
    else f.appendChild(el("div","pos",title.charAt(0)));
    var h=el("h2","",title),age=rs.map(function(s){return s.age}).filter(Boolean)[0];
    if(age)h.appendChild(el("span","bd",age));info.appendChild(h);
    if(F.original_title&&nz(F.original_title)!==nz(F.title))info.appendChild(el("p","orig",nice(F.original_title)));
    var meta=el("p","meta"),parts=[];
    function add(x){parts.push(x)}
    if(F.directors&&F.directors.length)add(document.createTextNode("r. "+F.directors.join(", ")));
    if(F.year)add(document.createTextNode(F.year));
    if(F.imdb_rating){var a1=el("a","","IMDb "+F.imdb_rating.toFixed(1));a1.href="https://www.imdb.com/title/"+F.imdb_id+"/";a1.target="_blank";a1.rel="noopener";add(a1)}
    if(F.lb_rating){var a2=el("a","","Letterboxd "+F.lb_rating.toFixed(1));a2.href="https://letterboxd.com/tmdb/"+F.tmdb_id+"/";a2.target="_blank";a2.rel="noopener";add(a2)}
    parts.forEach(function(p,i){if(i)meta.appendChild(document.createTextNode(" · "));meta.appendChild(p)});
    if(parts.length)info.appendChild(meta);
    var tm=el("div","tm");
    rs.sort(function(x,y){return x.time<y.time?-1:x.time>y.time?1:(x.cinema<y.cinema?-1:1)});
    rs.forEach(function(s){
      var ci=D.cinemas[s.cinema],so=s.status==="sold_out",it=el("div","it"),cn=el("div","cn");
      it.style.setProperty("--cc",ci.color);
      cn.appendChild(el("i"));cn.appendChild(el("span","",ci.short||ci.name));it.appendChild(cn);
      var a=so?el("span","t so"):el("a","t");
      if(!so){a.href=s.url;a.target="_blank";a.rel="noopener"}
      if(isToday&&s.time<now)a.className+=" past";
      a.appendChild(el("b","",s.time));
      a.appendChild(el("small","",so?"sold out":price(s)));
      it.appendChild(a);
      var nt=[shortNote(s.note),tags(s,F)].filter(Boolean).join(" · ");
      if(nt){var n=el("div","nt",nt);if(s.note)n.title=s.note;it.appendChild(n)}
      tm.appendChild(it);
    });
    info.appendChild(tm);
    f.appendChild(info);out.appendChild(f);
  });
}
function notes(){
  var n=document.getElementById("note");n.innerHTML="";
  Object.keys(D.sources).forEach(function(k){
    var s=D.sources[k];if(!(k in S.cin)&&!s.stale&&!s.error)return;
    var p=el("p","",s.name+": actualizat "+fmt(s.updated));
    if(s.stale)p.appendChild(el("span","warn"," — date vechi, sursa nu a răspuns la ultima verificare"));
    if(s.error)p.appendChild(el("span","warn"," — eroare la citire"));
    n.appendChild(p);
  });
  n.appendChild(el("p","","† Reducerea se acordă doar la casa de bilete a cinematografului, pe baza unui act doveditor."));
  n.appendChild(el("p","","* Nu am găsit un tarif redus pentru această proiecție; se arată prețul de adult."));
  n.appendChild(el("p","","Biletele online se cumpără pe site-ul fiecărui cinema. Posterele provin de la TMDB sau, când filmul nu e găsit acolo, de la Eventbook."));
  if(Object.keys(D.films).some(function(k){return D.films[k].imdb_rating}))n.appendChild(el("p","","Information courtesy of IMDb (https://www.imdb.com). Used with permission."));
  var t=el("div","tmdb"),im=el("img");im.src="tmdb-logo.svg";im.alt="TMDB";im.onerror=function(){im.style.display="none"};
  t.appendChild(im);t.appendChild(el("p","","This product uses the TMDB API but is not endorsed or certified by TMDB."));
  n.appendChild(t);
}
document.getElementById("sold").onclick=function(){S.sold=!S.sold;S.day=pickDay();ui()};
load();
</script>
</body>
</html>
