name: Scrape
on:
  workflow_dispatch:
  schedule:
    - cron: "17 5,9,13,17,21 * * *"
permissions:
  contents: write
concurrency:
  group: scrape
  cancel-in-progress: false
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scrape Eventbook
        run: python3 scrape.py
      - name: Completeaza cu TMDB
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          LETTERBOXD: "1"   # "0" oprește citirea notelor Letterboxd
        run: python3 tmdb.py
      - name: Salveaza datele
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Nicio schimbare"
          else
            git commit -m "Actualizare program"
            git push
          fi
