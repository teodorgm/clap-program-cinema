name: Probe3
on: workflow_dispatch
jobs:
  probe3:
    runs-on: ubuntu-latest
    steps:
      - name: Test structura
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, re, json, time
          from datetime import date, timedelta

          UA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"

          def get(url):
              req = urllib.request.Request(url, headers={
                  "User-Agent": UA,
                  "Accept": "text/html,application/json;q=0.9,*/*;q=0.8",
                  "Accept-Language": "ro-RO,ro;q=0.9,en;q=0.8",
              })
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, r.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode("utf-8", "replace")
              except Exception as e:
                  return None, repr(e)

          def clean(s):
              return re.sub(r"\s+", " ", s)

          def text(s):
              return clean(re.sub(r"<[^>]+>", " ", s))

          def head(t):
              print("\n" + "=" * 60 + "\n" + t)

          def run(name, fn):
              head(name)
              try:
                  fn()
              except Exception as e:
                  print("EROARE IN TEST:", repr(e))
              time.sleep(2)

          SKIP = ("abonament", "pass", "voucher", "carnet")

          def first_film(b):
              for m in re.finditer(r"/film/(bilete-[a-z0-9-]+)", b):
                  if not any(w in m.group(1) for w in SKIP):
                      return m
              return None

          def eventbook(url, before, after, price_page=False):
              st, b = get(url)
              print("STATUS", st, "| BYTES", len(b))
              slugs = sorted(set(re.findall(r"/film/(bilete-[a-z0-9-]+)", b)))
              print("SLUGS DISTINCTE:", len(slugs), slugs[:40])
              m = first_film(b)
              if m:
                  print("SNIPPET:", clean(b[max(0, m.start() - before): m.start() + after]))
              ld = re.findall(r'<script[^>]*ld\+json[^>]*>(.*?)</script>', b, re.S)
              print("JSON-LD BLOCURI:", len(ld))
              if ld:
                  print(clean(ld[0])[:1200])
              print("LINKURI PAGINI:", sorted(set(re.findall(r'href="([^"]*[?&]page=\d+[^"]*)"', b)))[:8])
              if price_page and m:
                  time.sleep(2)
                  slug = m.group(1)
                  st2, b2 = get("https://eventbook.ro/film/" + slug)
                  t = text(b2)
                  print("\nPAGINA FILM:", slug, "| STATUS", st2)
                  for kw in ("student", "elev", "pensionar", "lei"):
                      i = t.lower().find(kw)
                      if i >= 0:
                          print("  [" + kw + "]", t[max(0, i - 300): i + 300])
                          break
                  print("  PRETURI GASITE:", re.findall(r"\d+(?:[.,]\d+)?\s*lei", t)[:12])

          run("ELVIRE POPESCO", lambda: eventbook("https://eventbook.ro/hall/cinema-elvire-popesco", 1500, 2500, True))
          run("UNION", lambda: eventbook("https://eventbook.ro/hall/cinema-union", 400, 1200))
          run("APOLLO111", lambda: eventbook("https://eventbook.ro/hall/apollo111-cinema", 400, 1200))
          run("EFORIE", lambda: eventbook("https://eventbook.ro/hall/cinema-eforie", 400, 1200))

          def cinemacity():
              base = "https://www.cinemacity.ro/ro/data-api-service/v1/"
              st, b = get(base + "feed/10107/byName/now-playing?lang=ro_RO")
              posters = json.loads(b)["body"]["posters"]
              print("FILME IN FEED:", len(posters))
              print("CHEI FILM:", sorted(posters[0].keys()))
              print("PRIMUL FILM:", clean(json.dumps(posters[0], ensure_ascii=False))[:900])
              attrs = {}
              for p in posters:
                  for a in p.get("attributes", []):
                      attrs[a] = attrs.get(a, 0) + 1
              print("ATRIBUTE:", sorted(attrs.items(), key=lambda x: -x[1]))
              until = (date.today() + timedelta(days=14)).isoformat()
              today = date.today().isoformat()
              st, b = get(base + "quickbook/10107/cinemas/with-event/until/" + until + "?attr=&lang=ro_RO")
              cins = json.loads(b)["body"]["cinemas"]
              buc = [c for c in cins if "bucuresti" in c.get("groupId", "") or "ucure" in c.get("address", "")]
              for c in buc:
                  print("CINEMA", c.get("id"), "|", c.get("groupId"), "|", c.get("displayName"))
              afi = next((c for c in buc if "afi" in c.get("groupId", "")), None)
              if not afi:
                  print("AFI negasit")
                  return
              print("CHEI CINEMA:", sorted(afi.keys()))
              code = posters[0]["code"]
              urls = [
                  base + "quickbook/10107/film-events/in-cinema/%s/at-date/%s?attr=&lang=ro_RO" % (afi["id"], today),
                  base + "quickbook/10107/cinema-events/in-group/%s/with-film/%s/at-date/%s?attr=&lang=ro_RO" % (afi["groupId"], code, today),
                  base + "quickbook/10107/dates/in-cinema/%s/until/%s?attr=&lang=ro_RO" % (afi["id"], until),
              ]
              for u in urls:
                  time.sleep(2)
                  st, b = get(u)
                  print("\nURL:", u)
                  print("STATUS", st, "| BYTES", len(b))
                  print("RASPUNS:", clean(b)[:800])

          run("CINEMA CITY API", cinemacity)

          def cinemax():
              st, b = get("https://www.cine-max.ro/filme/program")
              print("STATUS", st, "| BYTES", len(b))
              print("SCRIPTURI:", re.findall(r'<script[^>]+src="([^"]+)"', b)[:20])
              print("URL-URI SUSPECTE:", sorted(set(re.findall(r'["\'](/[^"\' ]*(?:ajax|api|json|eID|type=\d+|program)[^"\' ]*)["\']', b)))[:20])
              print("FORMULARE:", re.findall(r"<form[^>]*>", b)[:5])
              print("OPTIUNI:", re.findall(r'<option[^>]*value="([^"]*)"[^>]*>([^<]*)', b)[:25])
              print("ATRIBUTE DATA:", re.findall(r'data-[a-z-]*(?:url|api|endpoint|src)[a-z-]*="[^"]+"', b)[:10])
              i = b.find("Acum în program")
              print("ZONA PROGRAM:", clean(b[max(0, i - 200): i + 1500]) if i >= 0 else "text negasit")

          run("CINEMAX", cinemax)

          def europa():
              base = "https://m.iabilet.ro"
              st, b = get(base + "/bilete-cinema-europa-venue-5877/")
              print("STATUS", st, "| BYTES", len(b))
              if st != 200:
                  print(clean(b)[:400])
                  return
              links = []
              for l in re.findall(r'href="((?:https://m\.iabilet\.ro)?/bilete-[a-z0-9-]+-\d+/)', b):
                  if "venue" not in l and l not in links:
                      links.append(l)
              print("EVENIMENTE GASITE:", len(links))
              for l in links[:20]:
                  print("  ", l)
              ld = re.findall(r'<script[^>]*ld\+json[^>]*>(.*?)</script>', b, re.S)
              print("JSON-LD BLOCURI:", len(ld))
              for l in links[:3]:
                  time.sleep(2)
                  u = l if l.startswith("http") else base + l
                  st2, b2 = get(u)
                  t = text(b2)
                  print("\nEVENIMENT:", u, "| STATUS", st2, "| BYTES", len(b2))
                  print("  ORE:", re.findall(r"\d{1,2} [A-Za-zâăîșț]+, \d{2}:\d{2}", t)[:12])
                  print("  PRETURI:", re.findall(r"\d+\s*lei", t)[:12])
                  print("  CATEGORII:", re.findall(r"(?:Acces General|Redus)[^0-9]{0,80}", t)[:8])

          run("EUROPA (iabilet)", europa)
          PY
